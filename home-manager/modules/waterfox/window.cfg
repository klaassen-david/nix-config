// home-manager/modules/waterfox/window.cfg — appended to the wrapper's mozilla.cfg
// Waterfox window customisation (runs privileged, once per browser window).
//
// Layout: the toolbox (url bar row) moves into the vertical tab strip, so
// there is no top bar; its first row is app menu, extensions, back, forward,
// reload. Url bar: Zen-like floating box (CSS in userChrome),
// suggestions on focus, Escape always closes, Ctrl+T creates the tab only
// when a result is opened, Tab cycles the search engine. Tree keys:
// Ctrl+Alt+arrows (Alt is sway's modifier). Ctrl+E / full screen hide the
// sidebar. Tabs hidden in collapsed branches unload after 15 min.
//
// Each feature runs in its own try, so one broken internal (these patch
// browser internals: _loadURL, _whereToOpen, BrowserCommands.openTab,
// endLayoutExtend) does not take the others down. Re-check on Waterfox updates.

Services.obs.addObserver(win => {
  const doc = win.document;
  const root = doc.documentElement;
  // Popups (window.open without toolbar) keep the stock layout: their sidebar
  // is off, so a moved url bar would leave them without a visible address.
  if (!win.toolbar.visible || root.hasAttribute("taskbartab")) {
    return;
  }
  const { TreeTabsService } = ChromeUtils.importESModule(
    "resource:///modules/TreeTabsService.sys.mjs"
  );
  const { SearchService } = ChromeUtils.importESModule(
    "moz-src:///toolkit/components/search/SearchService.sys.mjs"
  );
  const gB = win.gBrowser;
  const urlbar = doc.getElementById("urlbar");
  const ctx = { win, doc, root, gB, urlbar, TreeTabsService, SearchService };
  const feature = (name, fn) => {
    try {
      fn();
    } catch (e) {
      const msg = `[wf] ${name} failed: ${e}\n${e.stack}`;
      Services.console.logStringMessage(msg);
      dump(msg + "\n");
    }
  };

  feature("layout", () => {
    // Move the whole toolbox, not just #nav-bar: navigator-toolbox.js
    // delegates mousedown/command for several buttons (extensions, all-tabs,
    // firefox-view, downloads, library) to #navigator-toolbox. sidebar-main
    // only renders slot="tabstrip" (#vertical-tabs), so it goes inside that.
    const toolbox = doc.getElementById("navigator-toolbox");
    const vt = doc.getElementById("vertical-tabs");
    const home = { parent: toolbox.parentNode, next: toolbox.nextSibling };
    const move = (parent, next) =>
      parent.moveBefore ? parent.moveBefore(toolbox, next) : parent.insertBefore(toolbox, next);
    const intoSidebar = () => move(vt, vt.firstChild);
    intoSidebar();
    // Customize mode hides #browser (and with it the sidebar): put the toolbox
    // back while customizing.
    toolbox.addEventListener("beforecustomization", () => move(home.parent, home.next));
    toolbox.addEventListener("aftercustomization", intoSidebar);
    // The stock sidebar toggle (Ctrl+Alt+Z, sidebar button) display:none's the
    // container and the url bar with it; Ctrl+E below is the only toggle.
    doc.getElementById("toggleSidebarKb")?.setAttribute("disabled", "true");

    // Author level on purpose: ::part() rules from userChrome.css (a user
    // sheet) are not matched (the pinned grid needs one).
    const css = `
      #vertical-tabs { display: flex !important; flex-direction: column !important; }
      #vertical-tabs > #navigator-toolbox { background: transparent !important; border: none !important;
        padding: 0 !important; margin: 0 !important; box-shadow: none !important; }
      #vertical-tabs > #navigator-toolbox > :not(#nav-bar) { display: none !important; }
      #vertical-tabs #nav-bar { display: flex !important; flex-flow: row wrap !important; align-items: center !important;
        width: 100% !important; min-height: 0 !important; background: transparent !important;
        border: none !important; padding: 0 !important; }
      #vertical-tabs #nav-bar-customization-target { display: contents !important; }
      #vertical-tabs #nav-bar .titlebar-buttonbox-container,
      #vertical-tabs #nav-bar .titlebar-spacer,
      #vertical-tabs #sidebar-button { display: none !important; }
      #vertical-tabs #urlbar-container { min-width: 100% !important; width: 100% !important; order: 99;
        margin: 4px 0 !important;
        /* OverflowableToolbar only sums static/relative children; without this
           the full-width url bar pushes every button into the overflow menu */
        position: sticky !important; }
      /* app menu first: it is not a widget, so the placements cannot move it */
      #vertical-tabs #PanelUI-button { order: -1; }
      #wf-urlbar-ghost { display: none; }
      #vertical-tabs #urlbar[breakout-extend] ~ #wf-urlbar-ghost { display: flex; align-items: center;
        position: absolute; inset: 0; padding-inline: 8px; pointer-events: none;
        border-radius: var(--toolbarbutton-border-radius); color: var(--toolbar-field-color);
        background: var(--toolbar-field-background-color); }
      #wf-urlbar-ghost > span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      /* pinned tabs: a dense row of small icons (stock grid stretches 2 per row) */
      #tabbrowser-tabs[expanded] #pinned-tabs-container[orient="vertical"]::part(items-wrapper) {
        grid-template-columns: repeat(auto-fill, 28px) !important;
        grid-auto-rows: 26px !important;
      }
      #tabbrowser-tabs[expanded] #pinned-tabs-container[orient="vertical"] {
        min-height: 26px !important; padding-block: 2px !important; margin: 0 !important;
      }
      #tabbrowser-tabs[expanded] #pinned-tabs-container[orient="vertical"] .tabbrowser-tab {
        --tab-pinned-margin-inline-expanded: 1px !important; padding: 0 !important;
      }
      #vertical-pinned-tabs-splitter { margin-block: 0 !important; }
    `;
    win.windowUtils.loadSheetUsingURIString(
      "data:text/css," + encodeURIComponent(css),
      win.windowUtils.AUTHOR_SHEET
    );
  });

  feature("toolbar", () => {
    // Placements are global and persisted, so this only repairs drift (a
    // stock migration re-adding a button, a drag in customize mode).
    const { CustomizableUI } = ChromeUtils.importESModule(
      "moz-src:///browser/components/customizableui/CustomizableUI.sys.mjs"
    );
    for (const id of ["firefox-view-button", "waterfox-blocker-toolbar-button", "alltabs-button"]) {
      if (CustomizableUI.getPlacementOfWidget(id)) {
        CustomizableUI.removeWidgetFromArea(id);
      }
    }
    ["unified-extensions-button", "back-button", "forward-button", "stop-reload-button"].forEach((id, i) => {
      const p = CustomizableUI.getPlacementOfWidget(id);
      if (p?.area != "nav-bar" || p.position != i) {
        CustomizableUI.addWidgetToArea(id, "nav-bar", i);
      }
    });
  });

  feature("url bar stays in the sidebar", () => {
    // While floating, the url bar is a top-layer popover and its sidebar slot
    // is empty: show the page address there.
    const ghost = doc.createElement("div");
    ghost.id = "wf-urlbar-ghost";
    const text = ghost.appendChild(doc.createElement("span"));
    urlbar.after(ghost);
    new win.MutationObserver(() => {
      if (urlbar.hasAttribute("breakout-extend")) {
        const uri = gB.currentURI;
        text.textContent = win.isBlankPageURL(uri.spec) ? "" : win.BrowserUIUtils.trimURL(uri.displaySpec);
      }
    }).observe(urlbar, { attributes: true, attributeFilter: ["breakout-extend"] });
  });

  feature("suggestions on focus", () => {
    // With the page URL unchanged startQuery runs an empty search (top sites,
    // open tabs).
    urlbar.addEventListener("focusin", event => {
      win.setTimeout(() => {
        if (win.gURLBar.focused && !win.gURLBar.view.isOpen) {
          win.gURLBar.startQuery({ event });
        }
      }, 0);
    });
  });

  // Zen-like new tab: a bare "new tab" (Ctrl+T, + button, double-click on the
  // strip) only opens the floating url bar; the tab is created when a result
  // is opened from it. Cancelling (Escape, focus leaving the url bar) leaves no
  // tab behind.
  let pending = null; // { browser } of the tab that was current at Ctrl+T
  ctx.isPending = () => !!pending;
  const endPending = revert => {
    if (!pending) {
      return;
    }
    const { browser } = pending;
    pending = null;
    browser.userTypedValue = null; // don't leave the typed text on that tab
    if (revert) {
      win.gURLBar.handleRevert();
    }
  };
  feature("pending new tab", () => {
    const startPending = () => {
      pending = { browser: gB.selectedBrowser };
      win.gURLBar.value = "";
      win.gURLBar.focus();
      // open suggestions explicitly: focusin does not fire if already focused
      win.setTimeout(() => {
        if (pending && !win.gURLBar.view.isOpen) {
          win.gURLBar.startQuery({});
        }
      }, 50);
    };
    const origOpenTab = win.BrowserCommands.openTab.bind(win.BrowserCommands);
    win.BrowserCommands.openTab = function (args = {}) {
      const e = args.event;
      // a given url, middle-click paste or a modified click keep the stock path
      if (args.url || e?.button == 1 || e?.ctrlKey || e?.metaKey || e?.shiftKey || e?.altKey) {
        return origOpenTab(args);
      }
      return startPending();
    };
    // Every url-bar load ends in _loadURL, including paths that bypass
    // _whereToOpen (modified switch-to-tab, Shift on a one-off button).
    const origLoad = win.gURLBar._loadURL.bind(win.gURLBar);
    win.gURLBar._loadURL = function (url, event, where, ...rest) {
      if (pending) {
        if (where == "current") {
          where = "tab";
        }
        endPending(false);
      }
      return origLoad(url, event, where, ...rest);
    };
    // switching to an already open tab loads nothing: just end pending mode
    win.gBrowser.tabContainer.addEventListener("TabSelect", () => endPending(false));
    urlbar.addEventListener("focusout", () => {
      win.setTimeout(() => {
        // focus may move within the url bar (one-offs, identity box)
        if (!urlbar.contains(doc.activeElement)) {
          endPending(true);
        }
      }, 0);
    });
  });

  feature("escape closes", () => {
    urlbar.addEventListener(
      "keydown",
      event => {
        if (event.key != "Escape" || event.isComposing || event.shiftKey || event.ctrlKey || event.altKey) {
          return;
        }
        event.preventDefault();
        event.stopImmediatePropagation();
        win.gURLBar.view.close();
        endPending(false);
        if (win.gURLBar.searchMode) {
          win.gURLBar.searchMode = null;
        }
        win.gURLBar.handleRevert();
        gB.selectedBrowser.focus();
        // blur alone does not drop the floating state (Nova keeps it while focused)
        win.gURLBar.endLayoutExtend();
      },
      true
    );
  });

  feature("tab cycles search engine", () => {
    // no engine -> engine 1 -> ... -> engine n -> no engine
    ctx.cycleSearchTarget = async step => {
      const engines = await SearchService.getVisibleEngines();
      const names = [null, ...engines.map(e => e.name)];
      const current = win.gURLBar.searchMode?.engineName ?? null;
      const next = names[(names.indexOf(current) + step + names.length) % names.length];
      // setting searchMode keeps typed text and clears an unedited page URL
      win.gURLBar.searchMode = next ? { engineName: next, entry: "shortcut" } : null;
      win.gURLBar.startQuery({ allowAutofill: false });
    };
    urlbar.addEventListener(
      "keydown",
      event => {
        if (event.key != "Tab" || event.isComposing || event.ctrlKey || event.altKey || event.metaKey) {
          return;
        }
        // Once the user arrowed into the results or the one-off buttons, Tab
        // keeps its stock meaning (move through rows / buttons).
        const view = win.gURLBar.view;
        if (view.isOpen && (view.selectedRowIndex > 0 || view.oneOffSearchButtons?.selectedButton)) {
          return;
        }
        event.preventDefault();
        event.stopImmediatePropagation();
        ctx.cycleSearchTarget(event.shiftKey ? -1 : +1);
      },
      true
    );
  });

  // Keys are <key> elements (not keydown listeners) so they also fire while web
  // content has focus; reserved so pages cannot swallow them.
  const keyset = doc.getElementById("mainKeyset");
  ctx.keyset = keyset;
  const addKey = (id, attrs, modifiers, handler) => {
    const key = doc.createXULElement("key");
    key.id = id;
    for (const [name, value] of Object.entries(attrs)) {
      key.setAttribute(name, value);
    }
    key.setAttribute("modifiers", modifiers);
    key.setAttribute("reserved", "true");
    key.addEventListener("command", handler);
    keyset.appendChild(key);
  };

  feature("tree keys", () => {
    // rows as shown: gBrowser.visibleTabs drops collapsed branches' insides
    // (data-tree-hidden), extension-hidden tabs and collapsed tab groups, and
    // keeps the selected tab; pinned tabs live in their own icon row
    const visibleRows = () => gB.visibleTabs.filter(t => !t.pinned);
    const select = tab => {
      if (tab) {
        gB.selectedTab = tab;
      }
    };
    const step = delta => {
      const v = visibleRows();
      const i = v.indexOf(gB.selectedTab);
      if (i != -1) {
        select(v[i + delta]);
      }
    };
    ctx.treeKeys = {
      Up: () => step(-1), // never enters a collapsed branch
      Down: () => step(+1),
      // file-tree style: Left collapses an open branch, else goes to the parent
      Left: () => {
        const tab = gB.selectedTab;
        if (TreeTabsService.getChildren(tab).length && !TreeTabsService.isCollapsed(tab)) {
          TreeTabsService.collapseSubtree(tab);
        } else {
          select(TreeTabsService.getParent(tab));
        }
      },
      // Right expands a collapsed branch, else goes to the first child
      Right: () => {
        const tab = gB.selectedTab;
        if (TreeTabsService.isCollapsed(tab)) {
          TreeTabsService.expandSubtree(tab);
        } else {
          select(TreeTabsService.getChildren(tab)[0]);
        }
      },
    };
    for (const [dir, fn] of Object.entries(ctx.treeKeys)) {
      addKey(`wf-key-tree-${dir.toLowerCase()}`, { keycode: `VK_${dir.toUpperCase()}` }, "control,alt", fn);
    }
  });

  feature("sidebar toggle", () => {
    ctx.toggleSidebar = () => root.toggleAttribute("wf-sidebar-hidden");
    // Ctrl+E has no browser binding on Linux (search-focus-shortcut-alt is J there)
    addKey("wf-key-toggle-sidebar", { key: "E" }, "accel", ctx.toggleSidebar);
    // Full screen hides the sidebar (Ctrl+E still toggles it there); leaving it
    // restores the previous state. Needs browser.fullscreen.autohide=false:
    // Firefox's own autohide would slide the moved toolbox and reveal on hover.
    let hiddenBeforeFullscreen = null;
    win.addEventListener("sizemodechange", () => {
      if (win.fullScreen && hiddenBeforeFullscreen === null) {
        hiddenBeforeFullscreen = root.hasAttribute("wf-sidebar-hidden");
        root.toggleAttribute("wf-sidebar-hidden", true);
      } else if (!win.fullScreen && hiddenBeforeFullscreen !== null) {
        root.toggleAttribute("wf-sidebar-hidden", hiddenBeforeFullscreen);
        hiddenBeforeFullscreen = null;
      }
    });
  });

  // a keyset only picks up new <key> children when it is re-inserted
  feature("register keys", () => keyset.parentNode.insertBefore(keyset, keyset.nextSibling));

  feature("unload hidden branches", () => {
    const UNLOAD_HIDDEN_AFTER_MS = 15 * 60 * 1000;
    const timers = new Map();
    const cancel = tab => {
      win.clearTimeout(timers.get(tab));
      timers.delete(tab);
    };
    const keepLoaded = tab =>
      tab.soundPlaying || tab.hasAttribute("sharing") || tab.hasAttribute("activemedia-blocked");
    const schedule = tab => {
      // split-view wrappers carry data-tree-hidden too; only real tabs unload
      if (tab.localName != "tab" || timers.has(tab)) {
        return;
      }
      timers.set(
        tab,
        win.setTimeout(() => {
          timers.delete(tab);
          if (tab.isConnected && tab.hasAttribute("data-tree-hidden") && !keepLoaded(tab)) {
            gB.discardBrowser(tab); // refuses the selected / unloaded tabs itself
          }
        }, UNLOAD_HIDDEN_AFTER_MS)
      );
    };
    new win.MutationObserver(records => {
      for (const { target } of records) {
        if (target.hasAttribute("data-tree-hidden")) {
          schedule(target);
        } else {
          cancel(target);
        }
      }
    }).observe(gB.tabContainer, { attributes: true, attributeFilter: ["data-tree-hidden"], subtree: true });
    for (const tab of gB.tabs) {
      if (tab.hasAttribute("data-tree-hidden")) {
        schedule(tab); // hidden before this ran (session restore)
      }
    }
    gB.tabContainer.addEventListener("TabClose", e => cancel(e.target));
  });
}, "browser-delayed-startup-finished");
